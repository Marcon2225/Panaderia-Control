# Supabase Configuration
# https://supabase.com/docs/guides/cli/config

project_id = "panaderia-control"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54323
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop_port = 54326

[edge_functions]
enabled = true
port = 54327
import_map = "./supabase/functions/import_map.json"

[functions]
verify_jwt = true

[auth]
enabled = true
port = 9999
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false
min_password_length = 8
password_min_char_type = 2
max_frequency = "1m"
email_confirm_required = false
enable_email_autoconfirm = true
enable_phone_autoconfirm = false
enable_phone_signup = false
enable_email_signup = true
enable_email_change_confirm = true
sms_autoconfirm = false
external_phone_providers = []
external_email_providers = []
smtp_admin_email = ""
smtp_host = "localhost"
smtp_port = "2525"
smtp_user = ""
smtp_pass = ""
smtp_sender_name = "Panadería Control"
mailer_autoconfirm = true
email_template_path = "./supabase/templates"
enable_captcha = false
captcha_provider = ""
captcha_secret = ""
saml_providers = []
external_anonymous_providers = []
rate_limit = 100
rate_limit_window = "1m"
token_bucket_capacity = 100
token_bucket_refill_rate = 100